repos:
- repo: local
  hooks:
  - id: check-secrets
    name: Validate secrets/*.enc and block plaintext secrets in .env files
    entry: scripts/hooks/pre-commit-checks.sh
    language: system
    pass_filenames: false
    stages:
    - pre-commit
- hooks:
  - id: commitizen
  - id: commitizen-branch
    stages:
    - pre-push
  repo: https://github.com/commitizen-tools/commitizen
  rev: v4.17.0
